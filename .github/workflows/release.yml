name: Draft preview release
on:
  push:
    branches: ['release/v*']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Preview tag, for example v0.14.1-preview.1'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: preview-release
  cancel-in-progress: false
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Verify
        shell: pwsh
        run: ./scripts/Verify.ps1
      - name: Build portable ZIP
        shell: pwsh
        run: ./scripts/Package.ps1
      - name: Create a draft prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          ./scripts/Publish-Preview.ps1 -Tag $env:RELEASE_TAG
